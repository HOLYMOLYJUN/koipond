<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b4a4f">
  <meta name="description" content="An interactive koi pond rendered with Three.js and WebGL. Release Kohaku, Showa, Golden Ogon and Platinum koi, stir the water, summon rain and a vortex.">
  <title>Koi Pond</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230e6d72'/%3E%3Cpath d='M14 34c8-12 26-14 36-4-6 2-8 4-10 8 4 2 8 6 10 10-8-2-12-4-16-8-8 2-16 0-20-6z' fill='%23fff'/%3E%3Ccircle cx='38' cy='30' r='5' fill='%23e0401f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="pond" aria-label="Koi pond. Tap or drag on the water to make ripples."></canvas>

  <header class="brand ui">
    <h1>Koi Pond</h1>
    <p><span id="count">0 koi</span><span class="dot" aria-hidden="true">·</span><span class="tip">Touch the water</span></p>
  </header>

  <nav class="toolbar ui" aria-label="Pond controls">
    <button id="btn-sound" class="tool muted" type="button" aria-pressed="false" title="Sound (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      <span class="label">Sound</span>
    </button>
    <button id="btn-rain" class="tool" type="button" aria-pressed="false" title="Rain (R)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15.5a4.5 4.5 0 0 1-.4-9A5.5 5.5 0 0 1 17 7.6a3.9 3.9 0 0 1 .5 7.9z"/><path d="M8.5 18.5l-1 2M12.5 18.5l-1 2M16.5 18.5l-1 2"/></svg>
      <span class="label">Rain</span>
    </button>
    <button id="btn-vortex" class="tool" type="button" aria-pressed="false" title="Vortex (V)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12.2c.6-.9 2-.6 2 .6 0 1.8-2.6 2.6-4 1.2-2-2-.4-5.4 2.4-5.4 3.6 0 5.2 4.2 3 6.9-2.6 3.2-8.6 2.4-9.4-2.2C5.2 8.6 9 4.6 13.4 5c4.6.4 7.4 4.6 6.4 9"/></svg>
      <span class="label">Vortex</span>
    </button>
    <button id="btn-calm" class="tool" type="button" aria-pressed="false" title="Calm (C)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0 4.3-1.6 5 0"/><path d="M3 15c2.2-1.2 4.3-1.2 6.5 0s4.3 1.2 6.5 0 4.3-1.2 5 0"/></svg>
      <span class="label">Calm</span>
    </button>
    <button id="btn-clear" class="tool" type="button" title="Clear pond">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13c3-4 9-5 13-1-2 .7-3 1.5-3.6 3 1.6.7 3 2 3.6 3.6-3-.6-4.6-1.6-6-3-3 .7-5.6-.2-7-2.6z"/><path d="M18.5 4.5l-3 3M15.5 4.5l3 3"/></svg>
      <span class="label">Clear pond</span>
    </button>
    <button id="btn-hide" class="tool" type="button" aria-pressed="false" title="Hide UI for recording (H)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 20L20 4"/></svg>
      <span class="label">Hide UI</span>
    </button>
  </nav>

  <section class="dock ui" aria-label="Choose a koi">
    <div class="dock-head">
      <h2>Release a koi</h2>
      <p><span class="long">Tap a card to release · Drag onto the water to place</span><span class="short">Tap to release · Drag to place</span></p>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <div id="vortex-handle" aria-hidden="true"><span class="ring"></span><span class="ring r2"></span><span class="core"></span><span class="hint">Drag</span></div>
  <div id="drag-ghost" aria-hidden="true"><img alt=""></div>
  <div id="drop-marker" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="show-ui" type="button" title="Show UI (H or Esc)">Show UI</button>
  <div class="fallback">
    <h2>Koi Pond needs WebGL</h2>
    <p>Your browser could not start WebGL. Try a recent version of Chrome, Safari, Firefox or Edge.</p>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    setTimeout(function () {
      if (!document.body.classList.contains('ready')) document.body.classList.add('no-webgl');
    }, 15000);
  </script>
</body>
</html>
